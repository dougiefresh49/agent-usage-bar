name: Release Android

on:
  push:
    tags: ['v*-android']
  # Allow Version bump (and manual runs) to start Release. Tag pushes made with
  # GITHUB_TOKEN do not trigger workflow runs, so bump dispatches this explicitly.
  workflow_dispatch:

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: ${{ endsWith(github.ref_name, '-android') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          core="${tag#v}"
          core="${core%-android}"
          if [[ ! "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Android tag must look like vX.Y.Z-android (got ${tag})"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$core"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))

          echo "version_name=${core}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "Resolved Android versionName=${core} versionCode=${version_code}"

      - name: Prepare release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Required secret ${secret_name} is not configured"
              exit 1
            fi
          done

          keystore_path="${RUNNER_TEMP}/agent-usage-bar-release.p12"
          umask 077
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          test -s "${keystore_path}"
          echo "path=${keystore_path}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            --stacktrace
          cp app/build/outputs/apk/release/app-release.apk AgentUsageBar.apk

      - name: Verify release signature
        working-directory: android
        run: |
          set -euo pipefail
          apksigner_path="$(
            find "${ANDROID_HOME}/build-tools" -type f -name apksigner |
              sort -V |
              tail -n 1
          )"
          if [ -z "${apksigner_path}" ]; then
            echo "::error::Could not find apksigner in ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          "${apksigner_path}" verify --verbose --print-certs AgentUsageBar.apk

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --method POST \
            -f tag_name="${GITHUB_REF_NAME}" \
            --jq '.body' > dist/release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: android/AgentUsageBar.apk
          body_path: dist/release-notes.md
          make_latest: false
          name: Android ${{ github.ref_name }}

      - name: Remove release keystore
        if: always()
        run: rm -f "${{ steps.keystore.outputs.path }}"
